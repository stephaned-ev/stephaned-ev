<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d">
  <title id="t">Stéphaned — holographic ID card</title>
  <desc id="d">CTO, developer and freelancer based in Paris / Bordeaux, France. GitHub: stephaned-ev.</desc>

  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1013"/>
      <stop offset="1" stop-color="#162127"/>
    </linearGradient>
    <linearGradient id="iris" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="160" spreadMethod="reflect">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.25" stop-color="#7a5cff"/>
      <stop offset="0.5" stop-color="#ff4fd8"/>
      <stop offset="0.75" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#5cffb1"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-320 0;320 0;-320 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20,0 H0 V20" fill="none" stroke="#fff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="cardClip"><rect x="60" y="40" width="520" height="300" rx="22"/></clipPath>
  </defs>

  <style>
    .sans { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .label { font-size: 9px; letter-spacing: 2.5px; fill: #7f9494; }
    .value { font-size: 13px; fill: #e6eeee; }
    /* fake Y-axis rotation: width follows cos(angle), skew follows sin(angle) */
    .card   { transform-origin: 320px 190px; animation: tilt 7s linear infinite alternate; }
    .shadow { transform-origin: 320px 372px; animation: squash 7s linear infinite alternate; }
    .glare  { animation: sweep 7s linear infinite alternate; }
    .pulse  { animation: pulse 3s ease-in-out infinite; }
    @keyframes tilt {
      0%   { transform: translateY(4px)  skewY(-6deg)   scaleX(.866); }
      25%  { transform: translateY(-1px) skewY(-4.3deg) scaleX(.932); }
      50%  { transform: translateY(-4px) skewY(0deg)    scaleX(1); }
      75%  { transform: translateY(-1px) skewY(4.3deg)  scaleX(.932); }
      100% { transform: translateY(4px)  skewY(6deg)    scaleX(.866); }
    }
    @keyframes squash {
      0%, 100% { transform: scaleX(.866); }
      25%, 75% { transform: scaleX(.932); }
      50%      { transform: scaleX(1); }
    }
    @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(520px); } }
    @keyframes pulse { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .card, .shadow, .glare, .pulse { animation: none; }
    }
  </style>

  <ellipse class="shadow" cx="320" cy="372" rx="230" ry="10" fill="#000" opacity="0.35" filter="url(#soft)"/>

  <g class="card">
    <g clip-path="url(#cardClip)">
      <rect x="60" y="40" width="520" height="300" fill="url(#body)"/>
      <rect x="60" y="40" width="520" height="300" fill="url(#grid)"/>
      <rect x="60" y="40" width="520" height="300" fill="url(#iris)" opacity="0.2" style="mix-blend-mode:screen"/>
      <!-- holographic strip -->
      <rect x="60" y="232" width="520" height="2" fill="url(#iris)" opacity="0.9"/>
      <!-- glare band -->
      <g class="glare"><polygon points="60,40 200,40 120,340 -20,340" fill="url(#glare)"/></g>
    </g>
    <rect x="60.75" y="40.75" width="518.5" height="298.5" rx="21.25" fill="none" stroke="url(#iris)" stroke-width="1.5"/>

    <!-- chip -->
    <g transform="translate(92,72)" fill="none" stroke="#c9d6d8" stroke-opacity="0.75" stroke-width="1.2">
      <rect width="46" height="34" rx="6" fill="#c9d6d8" fill-opacity="0.08"/>
      <path d="M0,11 H15 V23 H0 M46,11 H31 V23 H46 M15,17 H31 M23,0 V11 M23,23 V34"/>
    </g>

    <!-- lantern fish emblem -->
    <g transform="translate(508,90) scale(0.42)">
      <g fill="#e6eeee" fill-opacity="0.12" stroke="#c9d6d8" stroke-opacity="0.8" stroke-width="2.4">
        <path d="M-62,0 L-112,-36 C-100,-12 -100,12 -112,36 Z"/>
        <path d="M-22,-29 C-8,-60 26,-54 32,-29 Z"/>
        <path d="M-70,0 C-50,-38 30,-42 70,-8 C79,0 79,8 70,14 C30,44 -50,36 -70,0 Z"/>
      </g>
      <path d="M44,-27 C52,-58 80,-62 95,-40" fill="none" stroke="#c9d6d8" stroke-opacity="0.8" stroke-width="2.4"/>
      <circle class="pulse" cx="95" cy="-40" r="14" fill="#ffd98a" filter="url(#glow)"/>
      <circle cx="95" cy="-40" r="6" fill="#fff6dc"/>
      <circle cx="46" cy="-6" r="6" fill="#ffd98a"/>
    </g>

    <text class="mono label" x="154" y="86">ACCESS · LEVEL 01</text>
    <text class="mono" x="154" y="102" font-size="11" letter-spacing="2" fill="#c9d6d8">ID 67502129</text>

    <text class="sans" x="92" y="178" font-size="42" font-weight="700" letter-spacing="-0.5" fill="#f4f8f8">Stéphaned</text>
    <text class="mono" x="93" y="206" font-size="12" letter-spacing="3.5" fill="url(#iris)">CTO · DEVELOPER · FREELANCER</text>

    <g class="mono">
      <text class="label" x="92" y="266">BASE</text>
      <text class="value" x="92" y="286">Paris, FR</text>
      <text class="label" x="208" y="266">HANDLE</text>
      <text class="value" x="208" y="286">@stephaned-ev</text>
      <text class="label" x="358" y="266">CONTACT</text>
      <text class="value" x="358" y="286">stephaned@protonmail.ch</text>
      <text class="label" x="92" y="318" fill-opacity="0.7">GITHUB.COM/STEPHANED-EV</text>
    </g>
  </g>
</svg>
