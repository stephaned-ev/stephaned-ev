name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 UTC, every day
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # PROFILE_3D_TOKEN (optional personal access token) lets the radar
          # count private activity; without it only public activity is counted.
          GITHUB_TOKEN: ${{ secrets.PROFILE_3D_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Drop the language pie and fit the radar scale
        run: python3 .github/scripts/trim_3d.py profile-3d-contrib/*.svg
      # main is protected (pull requests only), so the generated images
      # live on their own branch and the README points at it.
      - name: Publish images to the profile-3d branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd profile-3d-contrib
          git init -q -b profile-3d
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -q -m "generated"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" profile-3d
